<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self';">
    <title>MOON-KEY | Works</title>
    <meta name="description" content="MOON-KEY의 모든 프로젝트와 작업물을 확인하세요.">
    <meta property="og:site_name" content="MOON-KEY">
    <meta property="og:title" content="MOON-KEY | All Projects">
    <meta property="og:description" content="3D Computer Vision & AI 연구자의 프로젝트 포트폴리오">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://moon-key.pages.dev/projects.html">
    <meta property="og:locale" content="ko_KR">
    <meta property="og:image" content="https://moon-key.pages.dev/og-image.png?v=2">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://moon-key.pages.dev/og-image.png?v=2">
    <meta name="theme-color" content="#050508">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Theme toggle -->
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
        </svg>
        <svg class="moon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
    </button>

    <main class="projects-page">
        <a href="index.html" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            BACK TO HOME
        </a>

        <div class="projects-header">
            <h1>Works</h1>
            <p>아이디어를 현실로 만드는 과정에서 탄생한 작업물들입니다. 3D 비전, AI, 웹 서비스 등 다양한 분야를 탐구합니다.</p>
        </div>

        <div class="stats-summary">
            <div class="stat">
                <span class="stat-num" id="totalProjects">0</span>
                <span class="stat-label">TOTAL WORKS</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="liveProjects">0</span>
                <span class="stat-label">LIVE SERVICES</span>
            </div>
            <div class="stat">
                <span class="stat-num" id="technicalPosts">0</span>
                <span class="stat-label">TECHNICAL POSTS</span>
            </div>
        </div>

        <div class="filter-tabs">
            <button class="filter-tab active" data-filter="all">ALL</button>
            <button class="filter-tab" data-filter="PROJECT">PROJECTS</button>
            <button class="filter-tab" data-filter="TECHNICAL">TECHNICAL</button>
            <button class="filter-tab" data-filter="ARCHIVE">ARCHIVE</button>
        </div>

        <div class="projects-grid" id="projectsGrid">
            <!-- Projects loaded dynamically -->
        </div>
    </main>

    <footer>
        <span>&copy; 2026 MOON-KEY</span>
        <span>Built with mathematical rigor</span>
    </footer>

    <script src="main.js"></script>
    <script>
        // Projects page logic
        let allProjects = [];

        async function loadPageProjects() {
            const grid = document.getElementById('projectsGrid');
            try {
                const response = await fetch('projects.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                allProjects = await response.json();
                renderProjects(allProjects);
                updateStats(allProjects);
            } catch (error) {
                console.error('Failed to load projects:', error);
                showErrorFallback(grid);
            }
        }

        function showErrorFallback(container) {
            container.textContent = '';
            const errorDiv = document.createElement('div');
            errorDiv.className = 'projects-error';

            const h3 = document.createElement('h3');
            h3.textContent = 'Failed to load projects';

            const p = document.createElement('p');
            p.textContent = 'There was a problem loading the project data. Please try again.';

            const btn = document.createElement('button');
            btn.textContent = 'RETRY';
            btn.addEventListener('click', loadPageProjects);

            errorDiv.appendChild(h3);
            errorDiv.appendChild(p);
            errorDiv.appendChild(btn);
            container.appendChild(errorDiv);
        }

        function renderProjects(projects) {
            const grid = document.getElementById('projectsGrid');
            grid.textContent = '';

            projects.forEach(project => {
                const tagClass = project.tag === 'PROJECT' ? 'project' :
                               project.tag === 'ARCHIVE' ? 'archive' :
                               project.tag === 'RESEARCH' ? 'research' :
                               project.tag === 'TECHNICAL' ? 'technical' : '';

                const a = document.createElement('a');
                a.href = project.url;
                a.target = '_blank';
                a.rel = 'noopener noreferrer';
                a.className = 'project-card';
                a.setAttribute('data-tag', project.tag);

                const header = document.createElement('div');
                header.className = 'card-header';

                const tag = document.createElement('span');
                tag.className = 'tag ' + tagClass;
                tag.textContent = project.tag;
                header.appendChild(tag);

                if (project.live) {
                    const badge = document.createElement('span');
                    badge.className = 'live-badge';
                    badge.textContent = 'LIVE';
                    header.appendChild(badge);
                }

                const h3 = document.createElement('h3');
                h3.textContent = project.title;

                const p = document.createElement('p');
                p.textContent = project.description;

                const arrow = document.createElement('span');
                arrow.className = 'arrow';
                arrow.textContent = '\u2192';

                a.appendChild(header);
                a.appendChild(h3);
                a.appendChild(p);
                a.appendChild(arrow);

                grid.appendChild(a);
            });
        }

        function updateStats(projects) {
            const total = projects.length;
            const live = projects.filter(p => p.live === true).length;
            const technical = projects.filter(p => p.tag === 'TECHNICAL').length;

            animateStatNumber('totalProjects', total);
            animateStatNumber('liveProjects', live);
            animateStatNumber('technicalPosts', technical);
        }

        function animateStatNumber(elementId, target) {
            const element = document.getElementById(elementId);
            if (!element) return;
            let current = 0;
            const increment = target / 30;
            const timer = setInterval(() => {
                current += increment;
                if (current >= target) {
                    current = target;
                    clearInterval(timer);
                }
                element.textContent = Math.floor(current);
            }, 30);
        }

        // Filtering
        document.querySelectorAll('.filter-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                const filter = tab.dataset.filter;
                if (filter === 'all') {
                    renderProjects(allProjects);
                } else {
                    renderProjects(allProjects.filter(p => p.tag === filter));
                }
            });
        });

        loadPageProjects();
    </script>
</body>
</html>
